<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>三模型路由系统</title>
<style>
  :root {
    --bg: #0f1419; --panel: #1a2129; --border: #2a3340;
    --text: #e6edf3; --muted: #8b98a5; --accent: #4f8cff;
    --green: #3fb950; --red: #f85149; --yellow: #d29922;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text); display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 14px;
    padding: 12px 20px; border-bottom: 1px solid var(--border); background: var(--panel);
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; letter-spacing: .5px; }
  .status { display: flex; gap: 12px; margin-left: auto; align-items: center; }
  .dot { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
  .dot .b { width: 8px; height: 8px; border-radius: 50%; background: var(--red); }
  .dot.ok .b { background: var(--green); }
  button {
    font: inherit; cursor: pointer; border: 1px solid var(--border);
    background: #232c36; color: var(--text); border-radius: 8px; padding: 7px 14px;
  }
  button:hover { background: #2c3642; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover { background: #5d97ff; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  #btn-stop { border-color: var(--red); color: var(--red); }
  #btn-stop:hover { background: #3a2020; }

  #chat { flex: 1; overflow-y: auto; padding: 24px 20px; display: flex; flex-direction: column; gap: 16px; }
  .msg { max-width: 860px; width: 100%; margin: 0 auto; }
  .q { text-align: right; }
  .q .bubble { display: inline-block; background: var(--accent); color: #fff; padding: 10px 16px; border-radius: 14px 14px 4px 14px; white-space: pre-wrap; word-break: break-word; text-align: left; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
  .card .meta { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; font-size: 13px; }
  .tag { padding: 2px 8px; border-radius: 6px; font-size: 12px; background: #243041; color: #9ecbff; }
  .tag.deepseek { background: #1d2a3a; color: #6cb2ff; }
  .tag.qwen { background: #2a2f1d; color: #b5d65a; }
  .tag.kimi { background: #2d1f33; color: #d59aff; }
  .meta .cost { margin-left: auto; color: var(--muted); font-size: 12px; }
  pre.answer { margin: 0; white-space: pre-wrap; word-break: break-word; font-family: inherit; line-height: 1.6; font-size: 14px; }
  .card.summary { border-color: #4f8cff66; }
  .card.error { border-color: var(--red); }
  .error-text { color: var(--red); font-size: 13px; }
  .banner { max-width: 860px; width: 100%; margin: 0 auto; text-align: center; padding: 14px; border-radius: 12px; font-size: 14px; background: #2a2f1d; border: 1px solid #b5d65a55; }
  .banner .big { font-size: 16px; font-weight: 600; color: #b5d65a; }
  .hint { text-align: center; color: var(--muted); font-size: 13px; }

  footer { padding: 14px 20px 18px; border-top: 1px solid var(--border); background: var(--panel); }
  .input-box { max-width: 860px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
  .input-row { display: flex; gap: 10px; align-items: stretch; }
  textarea {
    flex: 1; resize: none; background: #0f1419; color: var(--text);
    border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px;
    font: inherit; font-size: 14px; min-height: 52px; max-height: 160px;
  }
  textarea:focus { outline: none; border-color: var(--accent); }
  select {
    background: #232c36; color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 8px 10px; font: inherit; font-size: 13px;
  }
  .spin { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--muted); border-top-color: var(--accent); border-radius: 50%; animation: sp 0.8s linear infinite; vertical-align: -2px; margin-right: 6px; }
  @keyframes sp { to { transform: rotate(360deg); } }

  /* 圆桌会诊直播 */
  .council { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 16px; }
  .round-title { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .round-title .live-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--red); animation: blink 1s infinite; flex: none; }
  @keyframes blink { 50% { opacity: .2; } }
  .seats { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
  .seat { background: #141a21; border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; }
  .seat .head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .seat .head .st { margin-left: auto; font-size: 12px; color: var(--muted); }
  .seat pre.answer { font-size: 13px; min-height: 20px; }
  .seat pre.answer.streaming::after { content: '▍'; color: var(--accent); animation: blink 1s infinite; }
  .answer.md { font-size: 13px; line-height: 1.7; }
  .answer.md h1, .answer.md h2 { font-size: 15px; font-weight: 600; margin: 14px 0 6px; }
  .answer.md h3 { font-size: 14px; font-weight: 600; margin: 10px 0 4px; }
  .answer.md p { margin: 6px 0; }
  .answer.md ul { margin: 6px 0; padding-left: 20px; }
  .answer.md li { margin: 3px 0; }
  .answer.md hr { border: none; border-top: 1px solid var(--border); margin: 12px 0; }
  .answer.md strong { font-weight: 600; }
  .toggle-debate { margin-left: auto; background: none; border: 1px solid var(--border); color: var(--accent); padding: 3px 10px; border-radius: 6px; font-size: 12px; }
  .toggle-debate:hover { background: #232c36; }
  .debate { margin-top: 12px; border-top: 1px solid var(--border); padding-top: 12px; display: flex; flex-direction: column; gap: 14px; }
  .seat.err { border-color: var(--red); }
  .seat.host { grid-column: 1 / -1; border-color: #4f8cff88; background: #16202e; }

  /* 设置弹窗 */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: none; align-items: center; justify-content: center; z-index: 10; }
  .overlay.show { display: flex; }
  .modal { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 22px; width: 440px; max-width: 92vw; }
  .modal h2 { margin: 0 0 6px; font-size: 16px; }
  .modal .sub { color: var(--muted); font-size: 12px; margin-bottom: 16px; line-height: 1.5; }
  .field { margin-bottom: 14px; }
  .field label { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 6px; }
  .field label .st { color: var(--muted); font-size: 12px; }
  .field label .st.ok { color: var(--green); }
  .field input {
    width: 100%; background: #0f1419; color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 12px; font: inherit; font-size: 13px;
  }
  .field input:focus { outline: none; border-color: var(--accent); }
  .modal .actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }

  /* 会话侧边栏 */
  .workspace { flex: 1; display: flex; min-height: 0; }
  #sidebar { width: 224px; flex: none; border-right: 1px solid var(--border); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
  .side-head { padding: 12px; border-bottom: 1px solid var(--border); flex: none; }
  .side-head button { width: 100%; }
  #session-list { flex: 1; overflow-y: auto; }
  .session-item { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--border); cursor: pointer; }
  .session-item:hover { background: #232c36; }
  .session-item.active { background: #1d2a3a; box-shadow: inset 2px 0 0 var(--accent); }
  .session-item .title { flex: 1; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .session-item .del { background: none; border: none; color: var(--muted); padding: 2px 6px; font-size: 14px; line-height: 1; }
  .session-item .del:hover { color: var(--red); }
  .chat-wrap { flex: 1; display: flex; flex-direction: column; min-width: 0; }
</style>
</head>
<body>
  <header>
    <h1>三模型路由系统</h1>
    <div class="status">
      <span class="dot" id="dot-deepseek"><span class="b"></span>DeepSeek</span>
      <span class="dot" id="dot-qwen"><span class="b"></span>Qwen</span>
      <span class="dot" id="dot-kimi"><span class="b"></span>Kimi</span>
    </div>
    <button id="btn-settings">⚙ 设置</button>
    <button id="btn-clear">删除会话</button>
  </header>

  <div class="workspace">
    <aside id="sidebar">
      <div class="side-head"><button id="btn-new">＋ 新建会话</button></div>
      <div id="session-list"></div>
    </aside>
    <div class="chat-wrap">
      <main id="chat">
        <div class="hint">输入问题，选择模式后发送。「圆桌会诊」可实时观看三个模型讨论并给出最终总结。</div>
      </main>

      <footer>
        <div class="input-box">
          <div class="input-row">
            <textarea id="q" placeholder="输入你的问题…（Enter 发送，Shift+Enter 换行）"></textarea>
            <select id="mode">
              <option value="council">圆桌会诊</option>
              <option value="route">智能路由</option>
              <option value="vote">举手表决</option>
            </select>
            <button class="primary" id="btn-send">发送</button>
            <button id="btn-stop" style="display:none">■ 停止</button>
          </div>
        </div>
      </footer>
    </div>
  </div>

  <div class="overlay" id="overlay">
    <div class="modal">
      <h2>配置 API Key</h2>
      <div class="sub">填入后点保存，立即生效（写入 .env，无需重启）。留空则保留原值。</div>
      <div class="field">
        <label>DeepSeek <span class="st" id="st-deepseek"></span></label>
        <input type="password" id="key-deepseek" placeholder="sk-...">
      </div>
      <div class="field">
        <label>Qwen（通义千问） <span class="st" id="st-qwen"></span></label>
        <input type="password" id="key-qwen" placeholder="通义千问 API key">
      </div>
      <div class="field">
        <label>Kimi（月之暗面） <span class="st" id="st-kimi"></span></label>
        <input type="password" id="key-kimi" placeholder="sk-...">
      </div>
      <div class="actions">
        <button id="btn-cancel">取消</button>
        <button class="primary" id="btn-save">保存</button>
      </div>
    </div>
  </div>

<script>
  const MODEL_LABEL = { deepseek: 'DeepSeek', qwen: 'Qwen', kimi: 'Kimi' };

  const $ = (id) => document.getElementById(id);
  const chat = $('chat'), q = $('q'), modeSel = $('mode');

  let currentId = null;  // 当前会话 id
  let councilAbort = null;  // 圆桌会诊的 AbortController（用于停止）

  // ---- key 状态 ----
  async function loadConfig() {
    try {
      const r = await fetch('/config');
      const data = await r.json();
      applyKeyStatus(data.keys || {});
    } catch (e) { console.error(e); }
  }
  function applyKeyStatus(keys) {
    for (const k of ['deepseek', 'qwen', 'kimi']) {
      const ok = !!keys[k];
      $('dot-' + k).classList.toggle('ok', ok);
      const st = $('st-' + k);
      st.textContent = ok ? '已配置' : '未配置';
      st.classList.toggle('ok', ok);
    }
  }

  // ---- 设置弹窗 ----
  $('btn-settings').onclick = () => { $('overlay').classList.add('show'); };
  $('btn-cancel').onclick = () => $('overlay').classList.remove('show');
  $('overlay').onclick = (e) => { if (e.target === $('overlay')) $('overlay').classList.remove('show'); };
  $('btn-save').onclick = async () => {
    const body = {
      deepseek: $('key-deepseek').value.trim(),
      qwen: $('key-qwen').value.trim(),
      kimi: $('key-kimi').value.trim(),
    };
    try {
      const r = await fetch('/config', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      const data = await r.json();
      applyKeyStatus(data.keys || {});
      $('key-deepseek').value = $('key-qwen').value = $('key-kimi').value = '';
      $('overlay').classList.remove('show');
    } catch (e) { alert('保存失败：' + e); }
  };

  // ---- 发送 ----
  $('btn-send').onclick = send;
  $('btn-stop').onclick = () => { if (councilAbort) councilAbort.abort(); };
  $('btn-new').onclick = () => newSession();
  q.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  });
  $('btn-clear').onclick = () => { if (currentId) deleteSession(currentId); };

  async function send() {
    const question = q.value.trim();
    if (!question) return;
    const mode = modeSel.value;
    q.value = '';
    addMsg('q', question);
    $('btn-send').disabled = true;
    try {
      if (mode === 'council') {
        await sendCouncil(question);
        return;
      }
      const loading = addLoading();
      try {
        const r = await fetch('/ask', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question, mode, session_id: currentId }),
        });
        const data = await r.json();
        loading.remove();
        if (data.status === 'error') {
          addError(data.message || '出错了');
        } else {
          renderResult(data.result);
        }
        refreshSessionList();
      } catch (e) {
        loading.remove();
        addError('请求失败：' + e);
      }
    } finally {
      $('btn-send').disabled = false;
    }
  }

  // ---- 圆桌会诊（SSE 直播）----
  async function sendCouncil(question) {
    const shell = addCouncilShell();
    councilAbort = new AbortController();
    $('btn-stop').style.display = '';
    try {
      const r = await fetch('/ask/stream', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question, mode: 'council', session_id: currentId }),
        signal: councilAbort.signal,
      });
      if (!r.ok || !r.body) throw new Error('HTTP ' + r.status);
      const reader = r.body.getReader();
      const dec = new TextDecoder();
      let buf = '';
      for (;;) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        let idx;
        while ((idx = buf.indexOf('\n\n')) >= 0) {
          const raw = buf.slice(0, idx); buf = buf.slice(idx + 2);
          for (const line of raw.split('\n')) {
            if (!line.startsWith('data:')) continue;
            try { handleCouncilEvent(shell, JSON.parse(line.slice(5).trim())); }
            catch (e) { console.error(e); }
          }
        }
      }
    } catch (e) {
      if (e.name === 'AbortError') {
        addError('已停止本次讨论。');
      } else {
        addError('圆桌会诊请求失败：' + e);
      }
    } finally {
      $('btn-stop').style.display = 'none';
      councilAbort = null;
    }
    refreshSessionList();
  }

  function addCouncilShell() {
    const div = document.createElement('div');
    div.className = 'msg';
    div.innerHTML = '<div class="council"></div>';
    chat.appendChild(div);
    scrollBottom();
    return { root: div.querySelector('.council'), labels: {}, seats: {}, currentSeats: null };
  }

  function handleCouncilEvent(shell, ev) {
    if (ev.type === 'init') {
      for (const m of ev.models) shell.labels[m.key] = m.label;
    } else if (ev.type === 'round') {
      const oldDot = shell.root.querySelector('.live-dot');
      if (oldDot) oldDot.remove();
      shell.seats = {};
      const sec = document.createElement('div');
      sec.className = 'round';
      sec.dataset.round = ev.round;
      sec.innerHTML = '<div class="round-title"><span class="live-dot"></span>' +
        escapeHtml(ev.title) + '</div><div class="seats"></div>';
      shell.root.appendChild(sec);
      shell.currentSeats = sec.querySelector('.seats');
    } else if (ev.type === 'delta') {
      const seat = getSeat(shell, ev.model, ev.round);
      seat.querySelector('pre.answer').textContent += ev.text;
    } else if (ev.type === 'model_done') {
      const seat = getSeat(shell, ev.model, ev.round);
      seat.querySelector('pre.answer').classList.remove('streaming');
      seat.querySelector('.st').textContent = ev.elapsed + 's';
    } else if (ev.type === 'model_error') {
      const seat = getSeat(shell, ev.model, ev.round);
      seat.classList.add('err');
      const pre = seat.querySelector('pre.answer');
      pre.classList.remove('streaming');
      pre.textContent = '调用失败：' + ev.message;
      seat.querySelector('.st').textContent = '✕';
    } else if (ev.type === 'verdict') {
      const dot = shell.root.querySelector('.live-dot');
      if (dot) dot.remove();
      const hostPre = shell.root.querySelector('.seat.host pre.answer');
      if (hostPre) {
        const div = document.createElement('div');
        div.className = 'answer md';
        div.innerHTML = renderMarkdown(hostPre.textContent);
        hostPre.replaceWith(div);
      }
      // 讨论结束：折叠前两轮辩论，总结卡加「查看辩论过程」按钮
      const rounds = shell.root.querySelectorAll('.round[data-round]');
      rounds.forEach((sec) => {
        if (sec.dataset.round !== '3') sec.style.display = 'none';
      });
      const hostRound = shell.root.querySelector('.round[data-round="3"]');
      if (hostRound) {
        const btn = document.createElement('button');
        btn.className = 'toggle-debate';
        btn.textContent = '查看辩论过程 ▾';
        btn.onclick = () => {
          const open = btn.textContent.indexOf('收起') >= 0;
          rounds.forEach((sec) => {
            if (sec.dataset.round !== '3') sec.style.display = open ? 'none' : 'block';
          });
          btn.textContent = open ? '查看辩论过程 ▾' : '收起辩论过程 ▴';
        };
        hostRound.querySelector('.round-title').appendChild(btn);
      }
    } else if (ev.type === 'error') {
      addError(ev.message);
    }
    scrollBottom();
  }

  function getSeat(shell, model, round) {
    if (shell.seats[model]) return shell.seats[model];
    const div = document.createElement('div');
    div.className = 'seat' + (round === 3 ? ' host' : '');
    div.innerHTML = '<div class="head"><span class="tag ' + escapeHtml(model) + '">' +
      escapeHtml(shell.labels[model] || model) + '</span><span class="st">…</span></div>' +
      '<pre class="answer streaming"></pre>';
    shell.currentSeats.appendChild(div);
    shell.seats[model] = div;
    return div;
  }

  function addMsg(kind, text) {
    const div = document.createElement('div');
    div.className = 'msg ' + kind;
    div.innerHTML = '<div class="bubble"></div>';
    div.querySelector('.bubble').textContent = text;
    chat.appendChild(div);
    scrollBottom();
  }

  function addLoading() {
    const div = document.createElement('div');
    div.className = 'msg';
    div.innerHTML = '<div class="card"><span class="spin"></span>思考中…</div>';
    chat.appendChild(div);
    scrollBottom();
    return div;
  }

  function addError(text) {
    const div = document.createElement('div');
    div.className = 'msg';
    div.innerHTML = '<div class="card error"><div class="error-text">' + escapeHtml(text) + '</div></div>';
    chat.appendChild(div);
    scrollBottom();
  }

  function renderResult(res) {
    if (!res) { addError('空结果'); return; }
    if (res.mode === 'route') {
      addAnswerCard(res.model_label, res.answer, {
        tag: res.model_label, cost: fmtCost(res), error: false,
      });
    } else if (res.mode === 'all') {
      for (const k of Object.keys(res.answers)) {
        const a = res.answers[k];
        addAnswerCard(a.label, a.text, { tag: a.label, cost: fmtCost(a), error: !!a.error });
      }
      if (res.summary && res.summary.text) {
        addSummaryCard(res.summary.model_label, res.summary.text);
      }
    } else if (res.mode === 'vote') {
      for (const k of Object.keys(res.answers)) {
        const a = res.answers[k];
        addAnswerCard(a.label, a.text, {
          tag: a.label, error: !!a.error,
          conclusion: a.conclusion,
        });
      }
      addVoteBanner(res);
    }
  }

  function addAnswerCard(label, text, opts) {
    const div = document.createElement('div');
    div.className = 'msg';
    const cls = opts.error ? 'card error' : 'card';
    let html = '<div class="' + cls + '"><div class="meta">' +
      '<span class="tag ' + (opts.tag || '').toLowerCase() + '">' + escapeHtml(opts.tag || label) + '</span>' +
      (opts.error ? '<span class="error-text">调用失败</span>' : '') +
      '<span class="cost">' + (opts.cost || '') + '</span></div>' +
      '<pre class="answer">' + escapeHtml(text || '') + '</pre>';
    if (opts.conclusion) {
      html += '<div class="meta" style="margin-top:10px"><span class="tag">结论</span><span>' + escapeHtml(opts.conclusion) + '</span></div>';
    }
    html += '</div>';
    div.innerHTML = html;
    chat.appendChild(div);
    scrollBottom();
  }

  function addSummaryCard(label, text) {
    const div = document.createElement('div');
    div.className = 'msg';
    div.innerHTML = '<div class="card summary"><div class="meta">' +
      '<span class="tag">综合点评 · ' + escapeHtml(label) + '</span></div>' +
      '<pre class="answer">' + escapeHtml(text) + '</pre></div>';
    chat.appendChild(div);
    scrollBottom();
  }

  function addVoteBanner(res) {
    const div = document.createElement('div');
    div.className = 'msg';
    if (res.result) {
      div.innerHTML = '<div class="banner">🎯 多数一致结论：<span class="big">' +
        escapeHtml(res.result) + '</span></div>';
    } else {
      div.innerHTML = '<div class="banner" style="border-color:#d2992255;background:#2d251f">⚠️ 无多数共识，存在分歧（详见各模型结论）</div>';
    }
    chat.appendChild(div);
    scrollBottom();
  }

  function fmtCost(a) {
    if (!a || a.elapsed == null) return '';
    const t = (a.prompt_tokens != null && a.completion_tokens != null)
      ? (a.prompt_tokens + a.completion_tokens) + ' tokens' : '';
    return a.elapsed + 's' + (t ? ' · ' + t : '');
  }

  function escapeHtml(s) {
    return String(s ?? '').replace(/[&<>"']/g, (c) =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  // 轻量 Markdown 渲染（标题/加粗/列表/分隔线），先转义再渲染，防 XSS
  function mdInline(s) {
    return s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  }
  function renderMarkdown(text) {
    const lines = escapeHtml(text).split('\n');
    let html = '', inList = false;
    const closeList = () => { if (inList) { html += '</ul>'; inList = false; } };
    for (const raw of lines) {
      const t = raw.trim();
      if (/^###\s/.test(t)) { closeList(); html += '<h3>' + mdInline(t.slice(4)) + '</h3>'; }
      else if (/^##\s/.test(t)) { closeList(); html += '<h2>' + mdInline(t.slice(3)) + '</h2>'; }
      else if (/^#\s/.test(t)) { closeList(); html += '<h1>' + mdInline(t.slice(2)) + '</h1>'; }
      else if (t === '---' || t === '***') { closeList(); html += '<hr>'; }
      else if (/^[-*]\s/.test(t)) { if (!inList) { html += '<ul>'; inList = true; } html += '<li>' + mdInline(t.slice(2)) + '</li>'; }
      else if (t === '') { closeList(); }
      else { closeList(); html += '<p>' + mdInline(t) + '</p>'; }
    }
    closeList();
    return html;
  }

  function scrollBottom() { chat.scrollTop = chat.scrollHeight; }

  // ---- 会话管理 ----
  async function fetchSessionList() {
    try {
      const r = await fetch('/sessions');
      return (await r.json()).sessions || [];
    } catch (e) { return []; }
  }

  function renderSessionList(list) {
    const box = $('session-list');
    box.innerHTML = '';
    for (const s of list) {
      const div = document.createElement('div');
      div.className = 'session-item' + (s.id === currentId ? ' active' : '');
      div.innerHTML = '<span class="title">' + escapeHtml(s.title || '新会话') + '</span>' +
        '<button class="del" title="删除">✕</button>';
      div.onclick = () => selectSession(s.id);
      div.querySelector('.del').onclick = (e) => { e.stopPropagation(); deleteSession(s.id); };
      box.appendChild(div);
    }
  }

  async function refreshSessionList() {
    renderSessionList(await fetchSessionList());
  }

  function addHint() {
    const div = document.createElement('div');
    div.className = 'hint';
    div.textContent = '输入问题，选择模式后发送。「圆桌会诊」可实时观看三个模型讨论并给出最终总结。';
    chat.appendChild(div);
  }

  async function selectSession(id) {
    currentId = id;
    chat.innerHTML = '';
    try {
      const r = await fetch('/sessions/' + id);
      const data = await r.json();
      const msgs = data.messages || [];
      if (!msgs.length) addHint();
      renderHistory(msgs);
    } catch (e) { addHint(); }
    renderSessionList(await fetchSessionList());
  }

  async function newSession() {
    const r = await fetch('/sessions/new', { method: 'POST' });
    const data = await r.json();
    currentId = data.session.id;
    chat.innerHTML = '';
    addHint();
    renderSessionList(await fetchSessionList());
  }

  async function deleteSession(id) {
    if (!confirm('确定删除这个会话？删除后不可恢复。')) return;
    await fetch('/sessions/' + id + '/delete', { method: 'POST' });
    if (id === currentId) currentId = null;
    const list = await fetchSessionList();
    renderSessionList(list);
    if (list.length) await selectSession(list[0].id);
    else await newSession();
  }

  async function initSessions() {
    const list = await fetchSessionList();
    renderSessionList(list);
    if (list.length) await selectSession(list[0].id);
    else await newSession();
  }

  // ---- 历史回放 ----
  function renderHistory(messages) {
    for (const m of messages) {
      if (m.role === 'user') {
        addMsg('q', m.content);
      } else if (m.kind === 'council') {
        addHistoryCouncil(m.content, m.debate);
      } else if (m.kind === 'vote') {
        addHistoryVote(m.content);
      } else {
        addHistoryAnswer(m.content);
      }
    }
    scrollBottom();
  }

  function addHistoryAnswer(text) {
    const div = document.createElement('div');
    div.className = 'msg';
    div.innerHTML = '<div class="card"><div class="meta"><span class="tag">回答</span></div>' +
      '<pre class="answer">' + escapeHtml(text) + '</pre></div>';
    chat.appendChild(div);
  }

  function addHistoryCouncil(text, debate) {
    const div = document.createElement('div');
    div.className = 'msg';
    const hasDebate = debate && debate.length;
    let html = '<div class="card summary"><div class="meta">' +
      '<span class="tag">主持人总结</span>';
    if (hasDebate) html += '<button class="toggle-debate">查看辩论过程 ▾</button>';
    html += '</div><div class="answer md">' + renderMarkdown(text) + '</div>';
    if (hasDebate) {
      html += '<div class="debate" style="display:none">' + renderDebate(debate) + '</div>';
    }
    html += '</div>';
    div.innerHTML = html;
    const btn = div.querySelector('.toggle-debate');
    if (btn) {
      btn.onclick = () => {
        const box = div.querySelector('.debate');
        const open = box.style.display !== 'none';
        box.style.display = open ? 'none' : 'block';
        btn.textContent = open ? '查看辩论过程 ▾' : '收起辩论过程 ▴';
      };
    }
    chat.appendChild(div);
  }

  function renderDebate(debate) {
    let html = '';
    for (const rd of debate) {
      html += '<div class="round"><div class="round-title">' +
        escapeHtml(rd.title || ('第 ' + rd.round + ' 轮')) + '</div><div class="seats">';
      for (const seat of (rd.seats || [])) {
        html += '<div class="seat' + (seat.error ? ' err' : '') + '"><div class="head"><span class="tag ' +
          escapeHtml(seat.model) + '">' + escapeHtml(seat.label) + '</span></div><pre class="answer">' +
          (seat.error ? '调用失败：' + escapeHtml(seat.error) : escapeHtml(seat.text)) + '</pre></div>';
      }
      html += '</div></div>';
    }
    return html;
  }

  function addHistoryVote(text) {
    const div = document.createElement('div');
    div.className = 'msg';
    div.innerHTML = '<div class="banner">🎯 多数一致结论：<span class="big">' + escapeHtml(text) + '</span></div>';
    chat.appendChild(div);
  }

  // 直接双击 html（file://）打开时，/config /ask 接口不存在，给出明确提示
  if (location.protocol === 'file:') {
    const div = document.createElement('div');
    div.className = 'msg';
    div.innerHTML = '<div class="card error"><div class="error-text">' +
      '⚠️ 当前是直接双击 html 打开的，保存和提问都不会生效。<br>' +
      '请双击同目录下的 <b>start.command</b> 启动服务，浏览器会自动打开 http://127.0.0.1:8000</div></div>';
    chat.insertBefore(div, chat.firstChild);
    $('btn-send').disabled = true;
    $('btn-save').disabled = true;
  } else {
    loadConfig();
    initSessions();
  }
</script>
</body>
</html>
